{% extends "base.html" %}
{% block content %}
<div class="page-title">📈 Comparative Analytics</div>

<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">Views Comparison (ID vs EN)</div>
            <div class="card-body">
                <canvas id="compareChart" height="100"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <!-- Top Performing Channel Dinamis -->
    <div class="col-md-6 mb-3">
        <div class="card h-100">
            <div class="card-header">Top Performing Channel</div>
            <div class="card-body text-center d-flex flex-column justify-content-center align-items-center">
                <h2 class="text-success fw-bold mb-2">{{ top_channel }}</h2>
                <p class="text-muted mb-0">{{ top_channel_desc }}</p>
            </div>
        </div>
    </div>

    <!-- Engagement Comparison Dinamis -->
    <div class="col-md-6 mb-3">
        <div class="card h-100">
            <div class="card-header">Engagement Comparison</div>
            <div class="card-body">
                <div class="mb-3">
                    <div class="d-flex justify-content-between mb-1">
                        <span>🇮🇩 ID Indonesia</span>
                        <span class="fw-bold">{{ stats.id.eng }}%</span>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-primary" role="progressbar" style="width: {{ stats.id.eng * 10 }}%" aria-valuenow="{{ stats.id.eng }}" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>

                <div>
                    <div class="d-flex justify-content-between mb-1">
                        <span>🇺🇸 US English</span>
                        <span class="fw-bold">{{ stats.en.eng }}%</span>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar bg-info" role="progressbar" style="width: {{ stats.en.eng * 10 }}%" aria-valuenow="{{ stats.en.eng }}" aria-valuemin="0" aria-valuemax="100"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const ctx = document.getElementById('compareChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ dates|safe }},
            datasets: [
                { 
                    label: 'Indo Views', 
                    data: {{ id_views|safe }}, 
                    borderColor: '#6366f1', 
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    fill: true,
                    tension: 0.4 
                },
                { 
                    label: 'English Views', 
                    data: {{ en_views|safe }}, 
                    borderColor: '#7c3aed', 
                    backgroundColor: 'rgba(124, 58, 237, 0.1)',
                    fill: true,
                    tension: 0.4 
                }
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });
});
</script>
{% endblock %}
