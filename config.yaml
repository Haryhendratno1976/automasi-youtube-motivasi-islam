# ============================================================
# Konfigurasi AI Agent -- YouTube/TikTok Shorts Automation
# ============================================================

# --- 1. Riset topik (research.py) ---
# Prioritas: Gemini AI (dinamis, ikut tren terkini sesuai niche di bawah).
# Kalau GEMINI_API_KEY tidak diset/gagal, otomatis fallback ke bank topik
# statis di dalam research.py (tetap jalan, cuma kurang variatif).
research:
  # PENTING soal kuota: "gemini-3.6-flash" HANYA dapat 20 request/hari di
  # free tier -- sangat mudah habis karena pipeline ini panggil Gemini
  # berkali-kali per video (riset topik, script, judul/hashtag, gambar AI,
  # DAN tiap cek filter visual "avoid_human_figures"). "gemini-3.5-flash-lite"
  # dapat ~1.000-1.500 request/hari di free tier -- jauh lebih realistis
  # untuk pipeline ini tanpa perlu bayar sama sekali. Kualitas sedikit di
  # bawah 3.6-flash, tapi lebih baik generate AI asli terus-menerus
  # daripada sering jatuh ke fallback template karena kuota habis.
  gemini_model: gemini-3.5-flash-lite

  # WAJIB untuk niche Islam -- aktifkan supaya prompt riset topik dapat
  # instruksi tambahan (hindari topik sektarian/khilafiyah, jangan
  # mengusulkan topik yang butuh kutip nomor ayat/hadits spesifik, tone
  # hangat-reflektif). Lihat _fetch_from_gemini() di research.py.
  islamic_content_guidelines: true

  niche:
    id: "motivasi Islami dan edukasi agama Islam untuk kehidupan sehari-hari (akhlak, ibadah, muamalah)"
    en: "Islamic motivation and Islamic education for everyday life (character, worship, practical wisdom)"

  keywords:
    id:
      - "motivasi islami"
      - "hijrah"
      - "akhlak mulia"
      - "sabar dan syukur"
      - "tawakal"
      - "kisah sahabat nabi"
      - "adab islami"
      - "muhasabah diri"
    en:
      - "islamic motivation"
      - "muslim mindset"
      - "prophetic wisdom"
      - "patience in islam"
      - "gratitude in islam"
      - "companions of the prophet"
      - "islamic character"
      - "self reflection islam"

  region:
    id: "Indonesia dan Malaysia"
    en: "Global Muslim audience (US, UK, international)"

# --- 2. Script generator (script_generator.py) ---
# Narasi + hook dibuat via Gemini AI (BUKAN ChatGPT/OpenAI -- seluruh
# pipeline ini sudah migrasi penuh ke google-genai). Kalau GEMINI_API_KEY
# kosong/gagal, otomatis fallback ke template (3 varian/bahasa per niche,
# tetap dipersonalisasi per topik -- termasuk template khusus Islami kalau
# islamic_content_guidelines aktif, lihat _build_fallback_script()).
script_generator:
  # Model UTAMA -- KHUSUS untuk generate NARASI/SCRIPT (bagian paling
  # menentukan kualitas cerita). "gemini-3.6-flash" cuma 20 request/hari
  # di free tier, TAPI karena di sini cuma dipanggil 1x per video, untuk
  # 4 video/hari itu cuma 4 request/hari -- jauh di bawah limit, aman.
  gemini_model: gemini-3.6-flash

  # Model SEKUNDER -- untuk judul+hashtag (per video) dan brand hashtag
  # (sekali seumur hidup, lihat brand_hashtag di bawah). Tidak butuh
  # kualitas setinggi narasi, jadi dipisah ke model berkuota longgar
  # supaya TIDAK ikut menggerus jatah 20/hari punya gemini_model di atas.
  gemini_model_secondary: gemini-3.5-flash-lite

  style:
    id: "reflektif, hangat, dan menenangkan -- bukan menggurui/menghakimi"
    en: "reflective, warm, and calming -- not preachy or judgmental"

  # WAJIB untuk niche Islam -- aktifkan supaya:
  # - Prompt Gemini dapat instruksi "ISLAMIC CONTENT ACCURACY" (boleh kutip
  #   hadits/ayat MASYHUR + penjelasan, tapi larang nomor rujukan spesifik;
  #   larang topik khilafiyah/sektarian -- lihat allow_famous_citations di
  #   bawah kalau mau ubah balik ke "tanpa kutipan sama sekali")
  # - Hook type yang dipakai otomatis dari ISLAMIC_HOOK_TYPES (bukan
  #   HOOK_TYPES yang bertema stoic/Marcus Aurelius)
  # - Template fallback pakai versi Islami (bukan motivasi umum)
  # - Hashtag strategy disesuaikan (5-8 hashtag, bukan 8-12)
  islamic_content_guidelines: true

  # true (default): boleh kutip ayat/hadits yang MASYHUR + penjelasan,
  # TANPA nomor rujukan spesifik (mis. tanpa "HR Bukhari no. 5027").
  # false: balik ke mode lama -- hindari kutipan sama sekali, fokus ke
  # hikmah/nilai umum saja.
  allow_famous_citations: true

  # Nama niche yang disisipkan ke prompt AI -- tanpa ini, kode fallback
  # ke "Life Motivation" secara default.
  niche_label:
    id: "motivasi dan edukasi Islam"
    en: "Islamic motivation and education"

  # Hashtag branding KONSISTEN di setiap video -- OPSIONAL. Kalau kamu
  # ISI manual di sini, itu SELALU dipakai. Kalau DIBIARKAN KOSONG/dihapus,
  # sistem AUTO-GENERATE lewat Gemini SEKALI SAJA (diturunkan dari
  # niche_label di atas), lalu disimpan permanen ke
  # reports/brand_hashtag_<lang>.json supaya tetap SAMA di semua video
  # berikutnya (bukan generate ulang tiap video -- itu akan menghilangkan
  # tujuan hashtag branding ini). Hapus baris di bawah kalau mau full
  # auto, atau isi manual kalau mau kontrol penuh nama brand-nya.
  brand_hashtag:
    id: "#RenunganHarianIslami"   # opsional -- hapus baris ini utk auto-generate
    en: "#DailyIslamicReminders"  # opsional -- hapus baris ini utk auto-generate

# --- 3. Video creator (creator.py) ---
video_creator:
  # Filter visual: TOLAK semua gambar/video yang menampilkan figur
  # manusia sama sekali (bukan cuma wanita) -- ganti ke kaligrafi,
  # masjid, alam, pola geometris. Ini SUPERSET dari avoid_women_in_visuals,
  # jadi avoid_women_in_visuals tidak perlu diaktifkan lagi (redundant).
  avoid_human_figures_in_visuals: true
  avoid_women_in_visuals: false   # tidak perlu, sudah tercakup di atas

  fps: 30
  # PENTING (per Sept 2026): generate gambar AI Gemini (Nano Banana /
  # gemini-3.1-flash-image dan semua variannya) SEKARANG TIDAK PUNYA TIER
  # GRATIS SAMA SEKALI lewat Developer API standar -- beda dari model teks
  # (gemini-3.6-flash dkk) yang masih gratis. Kalau GEMINI_API_KEY kamu
  # belum aktifkan billing, SEMUA percobaan generate gambar AI akan selalu
  # gagal dengan quota limit: 0 -- ini BUKAN bug, video tetap jalan normal
  # (fail-open otomatis ke Pexels), tapi berarti fitur "ai_image_ratio" di
  # bawah efektifnya TIDAK PERNAH benar-benar aktif tanpa billing.
  # Estimasi biaya kalau mau AKTIFKAN billing & benar-benar pakai fitur
  # ini: ~$0.067/gambar (resolusi 1K, model gemini-3.1-flash-image) --
  # untuk ai_image_ratio 0.35 x 5 scene x 4 video/hari x 30 hari, kira-kira
  # ~210 gambar/bulan = ~$14/bulan. Kalau tidak mau bayar sama sekali,
  # set ai_image_ratio ke 0 di bawah supaya tidak buang-buang waktu
  # request yang pasti gagal (video tetap 100% pakai Pexels, tidak masalah).
  gemini_image_model: gemini-3.1-flash-image
  # Persentase scene yang SENGAJA pakai gambar AI (bukan Pexels) walau
  # Pexels tersedia -- mitigasi "visual uniqueness filter" YouTube 2026
  # yang menurunkan ranking video ber-footage generik yang sama dipakai
  # banyak kreator lain. 0.35 = 35% scene pakai gambar AI unik -- TAPI
  # lihat catatan billing di atas, ini butuh billing aktif buat benar2 jalan.
  ai_image_ratio: 0.35

  # Berapa kandidat foto/video Pexels yang dicoba per-scene saat filter
  # avoid_human_figures_in_visuals aktif, sebelum menyerah ke sumber lain.
  # Tiap kandidat = 1 panggilan Gemini Vision (ikut kuota harian yang SAMA
  # dengan riset/script/dll) -- turunkan kalau kuota sering habis, naikkan
  # kalau ingin filter lebih ketat/akurat dan kuota longgar.
  visual_filter_max_candidates: 2

  # Model Gemini KHUSUS untuk klasifikasi visual (avoid_human_figures dll)
  # -- tugasnya cuma jawab YES/NO, tidak butuh model mahal/pintar. Default
  # flash-lite (kuota paling longgar) SENGAJA dipisah dari gemini_model di
  # atas (yang dipakai buat generate KONTEN, bukan klasifikasi).
  vision_check_model: gemini-3.5-flash-lite

  # ============================================================
  # MUSIK LATAR (nasheed vokal-only) -- OPT-IN
  # ============================================================
  # PENTING SOAL LISENSI: JANGAN pakai file yang di-download/scrape dari
  # YouTube atau sumber tidak jelas lisensinya -- untuk video yang
  # dimonetisasi/dijual sebagai produk, risiko Content ID claim/copyright
  # strike itu nyata. Sumber yang SUDAH terverifikasi eksplisit boleh
  # dipakai komersial/termonetisasi (per Agustus 2026):
  #   - https://aswati.co/vocals -- 8 track GRATIS (vokal-only, in-house,
  #     dilisensikan eksplisit utk YouTube termonetisasi/TikTok/client
  #     work), atau paket berbayar $9/bulan utk 70+ track + update bulanan
  #   - https://pixabay.com/music/search/islamic%20nasheed/ -- cek lisensi
  #     PER TRACK sebelum pakai (Pixabay License, bukan semua track sama)
  # Download beberapa track (disarankan 5-10 biar variatif), taruh semua
  # file .mp3/.wav di folder assets/music/ (folder ini sudah otomatis
  # dibuat pipeline-nya) -- pipeline akan ROTASI otomatis antar track
  # supaya tidak kedengaran itu-itu saja tiap video.
  background_audio_enabled: true
  # Volume musik latar RELATIF terhadap narasi (0.0 - 1.0). Sejak musik
  # latar di-loudness-normalize otomatis (ffmpeg loudnorm, -14 LUFS)
  # sebelum di-multiply angka ini, hasilnya jauh lebih KONSISTEN & lebih
  # TERDENGAR dibanding sebelumnya -- kalau dulu 0.25-0.35 nyaris tidak
  # kedengaran, sekarang seharusnya sudah jelas terdengar. Coba mulai dari
  # 0.25, dengarkan hasilnya, naik/turunkan dari situ.
  background_audio_volume: 0.35

  # ============================================================
  # VARIAN VIDEO TEKS-ONLY (tanpa suara narator)
  # ============================================================
  # Peluang (0.0 - 1.0) sistem RANDOM memilih varian "text_only" alih-alih
  # "voice" (narasi TTS) untuk tiap video yang di-generate. 0.2 = 20%
  # video akan jadi teks-only (musik latar dibesarkan, tanpa suara
  # narator, teks lebih besar/prominent di layar, durasi tiap scene
  # dihitung dari estimasi kecepatan baca -- lihat
  # _estimate_reading_duration() di creator.py). Set 0 utk matikan sama
  # sekali (selalu voice), set 1.0 utk selalu text_only.
  text_only_variant_ratio: 0.2

  # Volume musik latar KHUSUS untuk varian text_only -- jauh lebih besar
  # dari background_audio_volume di atas karena di sini musik latar
  # SATU-SATUNYA elemen audio (tidak ada narasi yang perlu dilindungi).
  background_audio_volume_text_only: 0.7

  # ============================================================
  # LOGO WATERMARK -- tampil di setiap video, pojok kanan atas
  # ============================================================
  logo_watermark:
    enabled: true
    path: "assets/branding/logo.png"   # taruh file logo.png di sini
    position: "top-right"   # top-left, top-right, bottom-left, bottom-right
    width_fraction: 0.16    # 16% dari lebar video (1080px) = ~172px
    margin: 30               # jarak dari tepi frame, dalam pixel
    opacity: 1.0             # 1.0 = solid penuh, turunkan (mis. 0.8) utk semi-transparan

  tts:
    # Engine TTS -- "edge_tts" (default, gratis, terbukti stabil) atau
    # "gemini" (native Gemini TTS -- lebih ekspresif/natural, gaya bicara
    # beda per-scene sesuai beat cerita, TAPI API-nya masih berstatus
    # PREVIEW per Agustus 2026, kuota belum pasti longgar). Kalau
    # "gemini" gagal di scene manapun (kuota habis, dll), OTOMATIS
    # fallback ke edge-tts untuk scene itu SAJA -- video tetap selesai,
    # cuma scene itu suaranya edge-tts, bukan Gemini. Estimasi biaya kalau
    # kena tarif berbayar: <$0.01/video, ~$1/bulan utk 4 video/hari.
    tts_engine: gemini
    gemini_tts_model: gemini-2.5-flash-preview-tts
    voices:
      # Cuma 2 voice neural resmi utk Bahasa Indonesia dari Microsoft --
      # ini SEMUA opsi yang ada, tidak ada yang "lebih natural" lagi utk
      # id-ID selain 2 ini (keterbatasan edge-tts, bukan bug kode).
      id: ["id-ID-ArdiNeural", "id-ID-GadisNeural"]
      # Ditambahkan voice generasi lebih baru yang menurut riset komunitas
      # edge-tts konsisten dinilai PALING natural/tidak robotic:
      # EmmaMultilingualNeural, AvaMultilingualNeural, GB-RyanNeural.
      en: ["en-US-ChristopherNeural", "en-US-GuyNeural", "en-US-EricNeural",
           "en-US-RogerNeural", "en-US-JennyNeural", "en-US-AriaNeural",
           "en-US-AndrewNeural", "en-US-EmmaNeural",
           "en-US-EmmaMultilingualNeural", "en-US-AvaMultilingualNeural",
           "en-GB-RyanNeural"]

    # Voice untuk engine "gemini" (dipakai HANYA kalau tts_engine: gemini
    # di atas). Sengaja belum diisi per-bahasa spesifik karena daftar
    # resmi 30+ nama voice Gemini TTS belum sempat diverifikasi satu-satu
    # cocoknya utk Bahasa Indonesia vs English -- default di kode (Kore,
    # Puck, Charon, Fenrir, Aoede) dipakai untuk KEDUA bahasa dulu. Kalau
    # sudah dengar hasilnya dan mau kurangi/ganti daftarnya, tambahkan:
    # gemini_voices:
    #   id: ["Kore", "Puck"]
    #   en: ["Charon", "Fenrir", "Aoede"]
    # Variasi rate/pitch KECIL, ACAK per-scene -- supaya suara tidak
    # terdengar 100% flat/seragam di seluruh durasi (ciri khas TTS yang
    # "kedengaran AI"). Rentang sengaja sempit supaya tetap terdengar
    # seperti 1 narator yang sama, bukan berubah-ubah drastis.
    rate_jitter_percent: 4   # +/- 4% kecepatan bicara
    pitch_jitter_hz: 3       # +/- 3Hz nada suara

    # --- Khusus varian text_only (tidak dipakai kalau variant="voice") ---
    # Kecepatan baca (kata/menit) yang dipakai buat hitung berapa lama tiap
    # scene ditampilkan -- SENGAJA konservatif (di bawah kecepatan baca
    # fokus normal ~200-250 wpm) karena ini dibaca sambil scroll di HP.
    text_only_reading_wpm: 170
    # Waktu tambahan (detik) di luar waktu baca murni -- kasih jeda buat
    # penonton SADAR teks baru muncul sebelum mulai membaca.
    text_only_reading_padding_sec: 0.7
    # Durasi MINIMUM mutlak per-scene (detik) -- supaya teks pendek tidak
    # berkedip terlalu cepat untuk sempat dibaca sama sekali.
    text_only_min_scene_duration: 2.2
  subtitles:
    font_size: 60
    font_color: "white"
    stroke_color: "black"
    stroke_width: 3
    max_width: 900
    safe_bottom_margin: 280
    # Posisi teks vertikal, 0.0 = paling atas, 1.0 = paling bawah.
    # Default sebelumnya 0.45 (tengah agak atas) -- diturunkan ~10% jadi
    # 0.55 sesuai permintaan.
    vertical_center_fraction: 0.55
    # font: "/path/ke/font-custom.ttf"   # opsional, default auto-detect DejaVu/Liberation/FreeSans
    # Khusus varian text_only -- teks jadi KONTEN UTAMA (bukan subtitle
    # pendamping suara), jadi dibuat lebih besar dari font_size di atas.
    # 1.35 = 35% lebih besar.
    text_only_font_size_multiplier: 1.35

# --- 4. Jadwal posting (main.py) ---
# Jadwal posting -- waktu ACAK di dalam tiap rentang, diacak ULANG setiap
# hari (bukan jam tetap), supaya polanya tidak terlalu mekanis.
# Mitigasi risiko kebijakan YouTube "inauthentic content" (2026) --
# riset kebijakan berulang kali menyebut "human oversight"/"editorial
# judgment" sebagai faktor yang membedakan channel yang selamat dari
# yang di-terminate. Kalau diaktifkan, video TIDAK auto-upload -- masuk
# antrian di dashboard (/review) dan perlu di-approve manual dulu.
publishing:
  require_manual_review: true

schedule:
  id:
    time_ranges:
      - ["16:30", "17:00"]
      - ["05:00", "05:30"]
  en:
    time_ranges:
      - ["06:30", "07:00"]
      - ["18:00", "18:30"]
