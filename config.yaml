# ============================================================
# Konfigurasi AI Agent -- YouTube/TikTok Shorts Automation
# ============================================================

# --- 1. Riset topik (research.py) ---
# Prioritas: Gemini AI (dinamis, ikut tren terkini sesuai niche di bawah).
# Kalau GEMINI_API_KEY tidak diset/gagal, otomatis fallback ke bank topik
# statis di dalam research.py (tetap jalan, cuma kurang variatif).
research:
  gemini_model: gemini-3.6-flash

  # WAJIB untuk niche Islam -- aktifkan supaya prompt riset topik dapat
  # instruksi tambahan (hindari topik sektarian/khilafiyah, jangan
  # mengusulkan topik yang butuh kutip nomor ayat/hadits spesifik, tone
  # hangat-reflektif). Lihat _fetch_from_gemini() di research.py.
  islamic_content_guidelines: true

  niche:
    id: "motivasi Islami dan edukasi agama Islam untuk kehidupan sehari-hari (akhlak, ibadah, muamalah)"
    en: "Islamic motivation and Islamic education for everyday life (character, worship, practical wisdom)"

  keywords:
    id:
      - "motivasi islami"
      - "hijrah"
      - "akhlak mulia"
      - "sabar dan syukur"
      - "tawakal"
      - "kisah sahabat nabi"
      - "adab islami"
      - "muhasabah diri"
    en:
      - "islamic motivation"
      - "muslim mindset"
      - "prophetic wisdom"
      - "patience in islam"
      - "gratitude in islam"
      - "companions of the prophet"
      - "islamic character"
      - "self reflection islam"

  region:
    id: "Indonesia dan Malaysia"
    en: "Global Muslim audience (US, UK, international)"

# --- 2. Script generator (script_generator.py) ---
# Narasi + hook dibuat via Gemini AI (BUKAN ChatGPT/OpenAI -- seluruh
# pipeline ini sudah migrasi penuh ke google-genai). Kalau GEMINI_API_KEY
# kosong/gagal, otomatis fallback ke template (3 varian/bahasa per niche,
# tetap dipersonalisasi per topik -- termasuk template khusus Islami kalau
# islamic_content_guidelines aktif, lihat _build_fallback_script()).
script_generator:
  style:
    id: "reflektif, hangat, dan menenangkan -- bukan menggurui/menghakimi"
    en: "reflective, warm, and calming -- not preachy or judgmental"

  # WAJIB untuk niche Islam -- aktifkan supaya:
  # - Prompt Gemini dapat instruksi "ISLAMIC CONTENT ACCURACY" (larang
  #   kutip nomor ayat/hadits spesifik, larang topik khilafiyah/sektarian)
  # - Hook type yang dipakai otomatis dari ISLAMIC_HOOK_TYPES (bukan
  #   HOOK_TYPES yang bertema stoic/Marcus Aurelius)
  # - Template fallback pakai versi Islami (bukan motivasi umum)
  # - Hashtag strategy disesuaikan (5-8 hashtag, bukan 8-12)
  islamic_content_guidelines: true

  # Nama niche yang disisipkan ke prompt AI -- tanpa ini, kode fallback
  # ke "Life Motivation" secara default.
  niche_label:
    id: "motivasi dan edukasi Islam"
    en: "Islamic motivation and education"

  # Hashtag branding KONSISTEN di setiap video -- OPSIONAL. Kalau kamu
  # ISI manual di sini, itu SELALU dipakai. Kalau DIBIARKAN KOSONG/dihapus,
  # sistem AUTO-GENERATE lewat Gemini SEKALI SAJA (diturunkan dari
  # niche_label di atas), lalu disimpan permanen ke
  # reports/brand_hashtag_<lang>.json supaya tetap SAMA di semua video
  # berikutnya (bukan generate ulang tiap video -- itu akan menghilangkan
  # tujuan hashtag branding ini). Hapus baris di bawah kalau mau full
  # auto, atau isi manual kalau mau kontrol penuh nama brand-nya.
  brand_hashtag:
    id: "#RenunganHarianIslami"   # opsional -- hapus baris ini utk auto-generate
    en: "#DailyIslamicReminders"  # opsional -- hapus baris ini utk auto-generate

# --- 3. Video creator (creator.py) ---
video_creator:
  # Filter visual: TOLAK semua gambar/video yang menampilkan figur
  # manusia sama sekali (bukan cuma wanita) -- ganti ke kaligrafi,
  # masjid, alam, pola geometris. Ini SUPERSET dari avoid_women_in_visuals,
  # jadi avoid_women_in_visuals tidak perlu diaktifkan lagi (redundant).
  avoid_human_figures_in_visuals: true
  avoid_women_in_visuals: false   # tidak perlu, sudah tercakup di atas

  fps: 30
  gemini_image_model: gemini-3.1-flash-image
  # Persentase scene yang SENGAJA pakai gambar AI (bukan Pexels) walau
  # Pexels tersedia -- mitigasi "visual uniqueness filter" YouTube 2026
  # yang menurunkan ranking video ber-footage generik yang sama dipakai
  # banyak kreator lain. 0.35 = 35% scene pakai gambar AI unik.
  ai_image_ratio: 0.35

  # ============================================================
  # MUSIK LATAR (nasheed vokal-only) -- OPT-IN
  # ============================================================
  # PENTING SOAL LISENSI: JANGAN pakai file yang di-download/scrape dari
  # YouTube atau sumber tidak jelas lisensinya -- untuk video yang
  # dimonetisasi/dijual sebagai produk, risiko Content ID claim/copyright
  # strike itu nyata. Sumber yang SUDAH terverifikasi eksplisit boleh
  # dipakai komersial/termonetisasi (per Agustus 2026):
  #   - https://aswati.co/vocals -- 8 track GRATIS (vokal-only, in-house,
  #     dilisensikan eksplisit utk YouTube termonetisasi/TikTok/client
  #     work), atau paket berbayar $9/bulan utk 70+ track + update bulanan
  #   - https://pixabay.com/music/search/islamic%20nasheed/ -- cek lisensi
  #     PER TRACK sebelum pakai (Pixabay License, bukan semua track sama)
  # Download beberapa track (disarankan 5-10 biar variatif), taruh semua
  # file .mp3/.wav di folder assets/music/ (folder ini sudah otomatis
  # dibuat pipeline-nya) -- pipeline akan ROTASI otomatis antar track
  # supaya tidak kedengaran itu-itu saja tiap video.
  background_audio_enabled: true
  # Volume musik latar RELATIF terhadap narasi (0.0 - 1.0). Narasi selalu
  # di volume penuh; angka ini melemahkan musik latar supaya tidak
  # menabrak kejelasan suara narator. 0.18 adalah titik awal yang aman --
  # naik/turunkan sambil dengarkan hasil videonya, tergantung seberapa
  # keras track nasheed yang kamu pakai.
  background_audio_volume: 0.18

  # ============================================================
  # LOGO WATERMARK -- tampil di setiap video, pojok kanan atas
  # ============================================================
  logo_watermark:
    enabled: true
    path: "assets/branding/logo.png"   # taruh file logo.png di sini
    position: "top-right"   # top-left, top-right, bottom-left, bottom-right
    width_fraction: 0.16    # 16% dari lebar video (1080px) = ~172px
    margin: 30               # jarak dari tepi frame, dalam pixel
    opacity: 1.0             # 1.0 = solid penuh, turunkan (mis. 0.8) utk semi-transparan

  tts:
    voices:
      id: ["id-ID-ArdiNeural", "id-ID-GadisNeural"]
      en: ["en-US-ChristopherNeural", "en-US-GuyNeural", "en-US-EricNeural",
           "en-US-RogerNeural", "en-US-JennyNeural", "en-US-AriaNeural",
           "en-US-AndrewNeural", "en-US-EmmaNeural"]
  subtitles:
    font_size: 60
    font_color: "white"
    stroke_color: "black"
    stroke_width: 3
    max_width: 900
    safe_bottom_margin: 280
    # Posisi teks vertikal, 0.0 = paling atas, 1.0 = paling bawah.
    # Default sebelumnya 0.45 (tengah agak atas) -- diturunkan ~10% jadi
    # 0.55 sesuai permintaan.
    vertical_center_fraction: 0.55
    # font: "/path/ke/font-custom.ttf"   # opsional, default auto-detect DejaVu/Liberation/FreeSans

# --- 4. Jadwal posting (main.py) ---
# Jadwal posting -- waktu ACAK di dalam tiap rentang, diacak ULANG setiap
# hari (bukan jam tetap), supaya polanya tidak terlalu mekanis.
# Mitigasi risiko kebijakan YouTube "inauthentic content" (2026) --
# riset kebijakan berulang kali menyebut "human oversight"/"editorial
# judgment" sebagai faktor yang membedakan channel yang selamat dari
# yang di-terminate. Kalau diaktifkan, video TIDAK auto-upload -- masuk
# antrian di dashboard (/review) dan perlu di-approve manual dulu.
publishing:
  require_manual_review: true

schedule:
  id:
    time_ranges:
      - ["13:50", "13:55"]
      - ["05:00", "05:30"]
  en:
    time_ranges:
      - ["06:30", "07:00"]
      - ["18:00", "18:30"]
